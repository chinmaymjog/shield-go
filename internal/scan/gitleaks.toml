title = "Org Secret Scanning Rules"
version = 3

[extend]
useDefault = true

[[rules]]
id = "generic-password-rule"
description = "Generic password assignment"
# SHIELD-5: the left boundary is `(?:^|[^A-Za-z])`, not `\b` — `\b` treats
# `_` as a word character, so it can't see a boundary inside compound names
# like MYSQL_PASSWORD/DB_PASSWORD/APP_SECRET (one continuous \w+ run, no
# internal \b at all). Requiring "not preceded by a letter" instead still
# blocks the original false positive this rule was written to avoid (`pass`
# inside `bypass`, preceded by the letter `y`) while matching the
# `_password`/`_secret` suffix shape that's extremely common in real env
# var names. Go's regexp (RE2) has no lookbehind, so this has to be a
# consuming alternation rather than an assertion. The value class adds
# . / + = ~ so base64 (with `/` and `=` padding) and JWTs (with `.`) are
# captured in full instead of truncating at the first such character.
regex = '''(?i)(?:^|[^A-Za-z])(?:password|passwd|pass|secret)\b\s*[:=]\s*["']?[A-Za-z0-9._/+=~!@#$%^&*()-]{8,}["']?'''
tags = ["password", "generic"]
severity = "high"

[[rules]]
id = "generic-connection-string-credentials"
description = "Database/service connection string with embedded credentials"
# gitleaks' default ruleset has no rule for this at all: a Postgres/MySQL/
# MongoDB/Redis/AMQP URI with a plaintext user:pass@host is a very common
# real leak (pasted straight from a local .env or a cloud console) and
# nothing else in the default set catches it. Matches scheme://[user]:pass@
# host — username is optional (redis://:pass@host is valid), password must
# be at least 4 chars and can't itself contain '@'/'/' (so the match doesn't
# run past the credentials into the host or path).
regex = '''(?i)\b(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|rediss|amqp|amqps)://[A-Za-z0-9._%+-]*:[^\s'"@/]{4,}@[A-Za-z0-9.-]+'''
tags = ["credentials", "connection-string", "generic"]
severity = "high"

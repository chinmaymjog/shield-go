stages:
  - test
  - release

test:
  image: golang:1.23
  stage: test
  tags:
    - lab
  script:
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

release:
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  stage: release
  tags:
    - lab
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - goreleaser release --clean

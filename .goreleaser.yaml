version: 2

project_name: shield

before:
  hooks:
    - go mod tidy

builds:
  - id: shield
    main: ./cmd/shield
    binary: shield
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/chinmaymjog/shield-go/internal/version.Version={{ .Version }}
      - -X github.com/chinmaymjog/shield-go/internal/version.Commit={{ .Commit }}
      - -X github.com/chinmaymjog/shield-go/internal/version.Date={{ .Date }}

archives:
  - id: shield-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: chinmaymjog
    name: shield-go

# GITHUB_TOKEN (repo scope, default in Actions or a PAT locally) creates the
# release above. HOMEBREW_TAP_TOKEN (repo scope PAT on homebrew-shield)
# authenticates the push below.
brews:
  - name: shield
    repository:
      owner: chinmaymjog
      name: homebrew-shield
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: main
    directory: Formula
    homepage: "https://github.com/chinmaymjog/shield-go"
    description: "Local git pre-commit secret scanning (gitleaks + trufflehog), installed once per machine."
    license: "MIT"
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    commit_msg_template: "brew: update shield to {{ .Tag }}"
    test: |
      system "#{bin}/shield", "version"
    install: |
      bin.install "shield"
    # Deliberately NOT a post_install hook: `shield install` sets git's
    # GLOBAL core.hooksPath, which affects every repo on the machine, not
    # just files under this formula's Cellar prefix. Homebrew has no
    # matching post_uninstall hook for Formulas, so a silent post_install
    # would be asymmetric with `brew uninstall` (global git config left
    # dangling) and would fire in any environment `brew install` runs in,
    # including CI/containers that just want the binary. A caveat pointing
    # at the explicit command keeps this an opt-in, auditable step for a
    # security tool while still being hard to miss.
    caveats: |
      Run `shield install` to activate the pre-commit hook (sets git's
      global core.hooksPath — covers every repo on this machine).
      Run `shield uninstall` before `brew uninstall` to reverse it.

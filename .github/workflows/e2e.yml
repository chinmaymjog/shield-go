name: End-to-end

# Builds shield, installs it as the global git hook on the runner (isolated
# HOME), and checks that a clean commit passes and a commit with a generated
# fake credential is blocked. See scripts/e2e.sh. The runner is the disposable
# environment; no secrets are used. Not a required check: path-filtered on PRs.
on:
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - scripts/e2e.sh
      - go.mod
      - go.sum
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Hook install and block
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Run end-to-end script
        run: scripts/e2e.sh

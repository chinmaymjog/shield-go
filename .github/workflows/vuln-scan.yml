name: Vulnerability scan

# govulncheck reports known vulnerabilities in the Go standard library and in
# dependencies that this code actually calls. The toolchain comes from go.mod
# (the `toolchain` line), so a vulnerable standard library shows up here and is
# fixed by bumping that line; shipped binaries are built with the same toolchain.
# Also runs weekly because new advisories are published against unchanged code.
on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/vuln-scan.yml
  push:
    branches: [main]
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vuln-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
